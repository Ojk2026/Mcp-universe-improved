name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish SDK to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker-release:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push nexus-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./nexus-core
          push: true
          tags: |
            ghcr.io/ojkotkalKP/mcp-universe/nexus-gateway:${{ steps.tag.outputs.VERSION }}
            ghcr.io/ojkotkalKP/mcp-universe/nexus-gateway:latest

      - name: Build and push session-manager
        uses: docker/build-push-action@v5
        with:
          context: ./session-management-system
          push: true
          tags: |
            ghcr.io/ojkotkalKP/mcp-universe/session-manager:${{ steps.tag.outputs.VERSION }}
            ghcr.io/ojkotkalKP/mcp-universe/session-manager:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-universe-frontend
          push: true
          tags: |
            ghcr.io/ojkotkalKP/mcp-universe/frontend:${{ steps.tag.outputs.VERSION }}
            ghcr.io/ojkotkalKP/mcp-universe/frontend:latest

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release, docker-release]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            .env.example
