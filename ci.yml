name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── SDK: lint, typecheck, test, build ──────────────────────────────────────
  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist

  # ── Docker: build all images ───────────────────────────────────────────────
  docker:
    name: Docker builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build nexus-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./nexus-core
          push: false
          tags: mcp-universe/nexus-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build session-manager
        uses: docker/build-push-action@v5
        with:
          context: ./session-management-system
          push: false
          tags: mcp-universe/session-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-universe-frontend
          push: false
          tags: mcp-universe/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Integration: docker-compose smoke test ────────────────────────────────
  integration:
    name: Integration smoke test
    runs-on: ubuntu-latest
    needs: [docker]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cp .env.example .env
          # Override with CI-safe values
          sed -i 's/VAIHDA_TAHAN_VAHVA_SALASANA/ci-test-password-32chars-long!!/g' .env
          sed -i 's/VAIHDA_TAHAN_SATUNNAINEN_64_MERKKI_AVAIN/ci-jwt-secret-64chars-long-enough-for-testing-purposes!!/g' .env
          sed -i 's/VAIHDA_TAHAN_VAHVA_SATUNNAINEN_AVAIN/ci-flask-secret-32chars-long!!!!/g' .env

      - name: Start services
        run: docker-compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          timeout 120 bash -c 'until docker-compose ps | grep -E "healthy" | wc -l | grep -q "^4"; do sleep 3; done'

      - name: Check frontend responds
        run: curl -sf http://localhost:8080/health

      - name: Check gateway responds
        run: |
          docker-compose exec -T nexus-gateway curl -sf http://localhost:3000/health

      - name: Print logs on failure
        if: failure()
        run: docker-compose logs

      - name: Teardown
        if: always()
        run: docker-compose down -v

  # ── Security: scan for vulnerabilities ────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on Docker configs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
